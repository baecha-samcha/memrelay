services:
  falkordb:
    image: falkordb/falkordb:v4.18.3
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - falkordb-data:/data
    environment:
      REDIS_ARGS: "--appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy noeviction"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  falkordb-data:
